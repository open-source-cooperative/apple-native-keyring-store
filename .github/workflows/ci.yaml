name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ci_stable:
    runs-on: macos-latest

    steps:
      - name: Fetch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install rust stable
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          components: rustfmt, clippy
          target: aarch64-apple-ios

      - name: Format check
        run: cargo fmt --check

      - name: Clippy check
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

      - name: Build and Test Keychain
        run: |
          cargo test --lib --verbose --features keychain
          cargo test --lib --verbose --features keychain -- --ignored

      - name: Build instantiation example
        run: cargo build --verbose --all-features --example instantiation

      - name: Build protected examples
        run: cargo build --target aarch64-apple-ios --verbose --features protected --examples

  ci_msrv:
    runs-on: macos-latest

    steps:
      - name: Fetch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install rust MSRV
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: 1.85
          components: clippy

      - name: Clippy check
        run: cargo clippy --no-deps --all-targets --all-features -- -D warnings

  package:
    runs-on: macos-latest

    steps:
      - name: Fetch head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install rust stable
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          cache: false

      - name: Package dry run
        run: cargo publish --dry-run
